<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Set New Password - Nextless CMS</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Noto+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1392ec",
                        "primary-dark": "#0f7ac8",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101a22",
                        "success": "#10b981", // Teal/Green for validation
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"],
                        "body": ["Noto Sans", "sans-serif"],
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "0.75rem",
                        "xl": "1rem",
                        "2xl": "1.5rem",
                        "full": "9999px"
                    },
                    boxShadow: {
                        'soft': '0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -1px rgba(0, 0, 0, 0.02)',
                        'card': '0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.025)',
                    }
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar to match minimalist aesthetic */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        
        .material-symbols-outlined {
            font-variation-settings:
            'FILL' 0,
            'wght' 300,
            'GRAD' 0,
            'opsz' 24
        }
        
        /* Smooth transitions */
        .transition-all-custom {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-body text-slate-900 dark:text-white min-h-screen flex flex-col justify-center items-center p-4 sm:p-6 lg:p-8">
<!-- Navbar / Header area (Simplified for this focus page) -->
<div class="absolute top-0 left-0 w-full p-6 flex justify-between items-center">
<div class="flex items-center gap-3 select-none">
<div class="w-8 h-8 flex items-center justify-center bg-primary/10 rounded-lg text-primary">
<span class="material-symbols-outlined text-[20px]">layers</span>
</div>
<span class="font-display font-bold text-xl tracking-tight text-slate-900 dark:text-white">Nextless CMS</span>
</div>
<div class="hidden sm:block">
<a class="text-sm font-medium text-slate-500 hover:text-primary transition-colors" href="#">Need help?</a>
</div>
</div>
<!-- Main Card Container -->
<div class="w-full max-w-[480px] bg-white dark:bg-slate-900 rounded-xl shadow-card border border-slate-100 dark:border-slate-800 overflow-hidden relative z-10">
<!-- Card Content -->
<div class="p-8 sm:p-10">
<!-- Header Section -->
<div class="text-center mb-8">
<div class="w-12 h-12 bg-primary/10 rounded-full flex items-center justify-center mx-auto mb-4 text-primary">
<span class="material-symbols-outlined text-[24px]">lock_reset</span>
</div>
<h1 class="font-display text-2xl sm:text-3xl font-bold text-slate-900 dark:text-white mb-2 tracking-tight">Set new password</h1>
<p class="text-slate-500 dark:text-slate-400 text-sm font-normal leading-relaxed">
                    Your new password must be different from previously used passwords.
                </p>
</div>
<!-- Form -->
<form class="flex flex-col gap-5">
<!-- Input 1: New Password -->
<div class="space-y-1.5">
<label class="block text-sm font-medium text-slate-700 dark:text-slate-300" for="new-password">
                        New password
                    </label>
<div class="relative group">
<input class="block w-full rounded-lg border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-950 text-slate-900 dark:text-white shadow-sm focus:border-primary focus:ring-primary sm:text-sm py-3 px-4 pr-10 transition-all-custom placeholder:text-slate-400" id="new-password" placeholder="Enter new password" type="password"/>
<button class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 cursor-pointer" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Password Strength Checklist -->
<div class="bg-slate-50 dark:bg-slate-800/50 rounded-lg p-4 space-y-3 border border-slate-100 dark:border-slate-800/50">
<p class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Password strength</p>
<div class="flex items-center gap-2.5">
<div class="flex-shrink-0 w-4 h-4 rounded-full bg-success/10 flex items-center justify-center">
<span class="material-symbols-outlined text-[10px] text-success font-bold">check</span>
</div>
<span class="text-sm text-slate-600 dark:text-slate-400">At least 8 characters</span>
</div>
<div class="flex items-center gap-2.5">
<div class="flex-shrink-0 w-4 h-4 rounded-full border border-slate-300 dark:border-slate-600 flex items-center justify-center">
<!-- Inactive state: empty or subtle dot -->
</div>
<span class="text-sm text-slate-600 dark:text-slate-400">At least 1 number</span>
</div>
<div class="flex items-center gap-2.5">
<div class="flex-shrink-0 w-4 h-4 rounded-full border border-slate-300 dark:border-slate-600 flex items-center justify-center">
<!-- Inactive state -->
</div>
<span class="text-sm text-slate-600 dark:text-slate-400">At least 1 special character</span>
</div>
</div>
<!-- Input 2: Confirm Password -->
<div class="space-y-1.5 mt-1">
<label class="block text-sm font-medium text-slate-700 dark:text-slate-300" for="confirm-password">
                        Confirm password
                    </label>
<div class="relative">
<input class="block w-full rounded-lg border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-950 text-slate-900 dark:text-white shadow-sm focus:border-primary focus:ring-primary sm:text-sm py-3 px-4 pr-10 transition-all-custom placeholder:text-slate-400" id="confirm-password" placeholder="Confirm new password" type="password"/>
<button class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 cursor-pointer" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="mt-4 w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-bold text-white bg-primary hover:bg-primary-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all-custom active:scale-[0.98]" type="submit">
                    Update password
                </button>
</form>
<!-- Back Link -->
<div class="mt-8 text-center">
<a class="inline-flex items-center justify-center text-sm font-medium text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-white transition-colors group" href="#">
<span class="material-symbols-outlined text-[18px] mr-1 transition-transform group-hover:-translate-x-1">arrow_back</span>
                    Back to login
                </a>
</div>
</div>
<!-- Decorative subtle bottom bar -->
<div class="h-1.5 w-full bg-gradient-to-r from-transparent via-primary/20 to-transparent"></div>
</div>
<!-- Footer/Legal (Optional for context) -->
<div class="absolute bottom-6 text-center text-xs text-slate-400 dark:text-slate-600 font-medium">
        © 2024 Nextless CMS. All rights reserved.
    </div>
</body></html>
