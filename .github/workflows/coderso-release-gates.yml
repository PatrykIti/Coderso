name: Coderso Release Gates

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "core/**"
      - "tests/**"
      - "_docs/**"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/coderso-release-gates.yml"

jobs:
  coderso-release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "true"
      FORM_SUBMIT_NONCE_SECRET: "nextless_release_gate_nonce_secret_32"
      CODERSO_PERF_LISTING_P95_CACHED_MS: "300"
      CODERSO_PERF_LISTING_P95_COLD_MS: "900"
      CODERSO_PERF_ADMIN_NAV_P95_MS: "150"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Coderso release gates
        run: bun scripts/coderso-release-gates.ts --report .tmp/coderso-release-gates.json

      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coderso-release-gates-report
          path: .tmp/coderso-release-gates.json
