name: Testing Lanes

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "core/**"
      - "packages/**"
      - "tests/**"
      - "_docs/**"
      - "AGENTS.md"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/testing-lanes.yml"

permissions:
  contents: read

jobs:
  vitest-lane:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint core
        run: bun --cwd core lint

      - name: Typecheck core
        run: bun --cwd core lint:types

      - name: Lint store
        run: bun --cwd store lint

      - name: Typecheck SDK
        run: ./node_modules/.bin/tsc -p packages/sdk/tsconfig.json --noEmit

      - name: Run Vitest lane
        run: bun run test:vitest

      - name: Run Vitest coverage
        run: bun run test:coverage

      - name: Upload Vitest coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage
          path: coverage/vitest

  bun-lane:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # DB-backed route suites join the lane when this secret is configured;
      # env-dependent suites remain skipped by the lane helper otherwise.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Bun lane
        run: bun run test:bun:lane

      - name: Run Bun coverage
        run: bun run test:coverage:bun

      - name: Upload Bun coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bun-coverage
          path: coverage/bun
