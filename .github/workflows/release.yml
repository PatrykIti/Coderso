name: Semantic Release

on:
  workflow_dispatch:
    inputs:
      recovery_image_version:
        description: Stable version whose original verified image should recover :latest
        required: false
        type: string
      recovery_image_digest:
        description: Original verified immutable sha256 digest already stored under that version
        required: false
        type: string
  push:
    branches:
      - main

# Keep the semantic-release decision and Docker promotion in one serialized
# lane. GitHub retains at most one pending run for this group; a newer queued
# run may replace that pending run, but two release workflows never execute at
# the same time and an older slow build cannot race a newer run for :latest.
concurrency:
  group: coderso-release
  cancel-in-progress: false

env:
  BUN_VERSION: 1.3.14
  NODE_VERSION: 26.5.0
  DOCKER_IMAGE_NAME: coderso-core

jobs:
  semantic-release:
    name: Semantic release
    if: >-
      github.event_name != 'workflow_dispatch' ||
      (inputs.recovery_image_version == '' && inputs.recovery_image_digest == '')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      pull-requests: read
    outputs:
      released: ${{ steps.release-metadata.outputs.released }}
      version: ${{ steps.release-metadata.outputs.version }}
      git_tag: ${{ steps.release-metadata.outputs.git_tag }}
    steps:
      - name: Create semantic-release GitHub App token
        id: semantic-release-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SEMANTIC_RELEASE_APP_ID }}
          private-key: ${{ secrets.SEMANTIC_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.semantic-release-app-token.outputs.token }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify release runtime
        run: |
          node --version
          bun --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run semantic-release
        env:
          GH_TOKEN: ${{ steps.semantic-release-app-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.semantic-release-app-token.outputs.token }}
        run: bun run release:semantic

      - name: Export release metadata
        id: release-metadata
        run: |
          if [ -f .tmp/semantic-release.env ]; then
            cat .tmp/semantic-release.env >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "git_tag=" >> "$GITHUB_OUTPUT"
          fi

  # An ordinary job rerun re-exports provenance and can therefore produce a
  # new candidate index digest. It must never overwrite an immutable version
  # tag or use that new candidate to recover :latest. This explicit operator
  # lane performs no build: it accepts the original verified digest, requires
  # authenticated equality with the existing version tag, and only then copies
  # that version digest to :latest when it is still the highest remote release.
  recover-docker-image:
    name: Recover Docker latest tag
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.recovery_image_version != '' || inputs.recovery_image_digest != '')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout recovery tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set recovery image refs
        id: recovery-image
        env:
          RECOVERY_IMAGE_VERSION: ${{ inputs.recovery_image_version }}
          RECOVERY_IMAGE_DIGEST: ${{ inputs.recovery_image_digest }}
        run: |
          stable_version_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if ! [[ "${RECOVERY_IMAGE_VERSION}" =~ ${stable_version_pattern} ]]; then
            echo "::error::recovery_image_version must be an exact stable SemVer without leading zeros."
            exit 1
          fi
          if ! [[ "${RECOVERY_IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::recovery_image_digest must be one lowercase sha256 digest."
            exit 1
          fi
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          image_name="$(printf '%s' "${DOCKER_IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/${image_name}"
          printf 'version_ref=%s\n' "${image}:${RECOVERY_IMAGE_VERSION}" >> "$GITHUB_OUTPUT"
          printf 'latest_ref=%s\n' "${image}:latest" >> "$GITHUB_OUTPUT"
          printf 'recovery_digest=%s\n' "${RECOVERY_IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx for recovery
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GHCR for recovery
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Recover latest from the original verified version digest
        shell: bash
        env:
          VERSION_REF: ${{ steps.recovery-image.outputs.version_ref }}
          LATEST_REF: ${{ steps.recovery-image.outputs.latest_ref }}
          RECOVERY_VERSION_DIGEST: ${{ steps.recovery-image.outputs.recovery_digest }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/promote-release-image.sh

  # Verified here as well as in the PR gates, and not by duplication: this job
  # builds the RELEASE TAG, and semantic-release commits a regenerated bun.lock
  # plus four package.json files onto it (see release.config.cjs). The tree this
  # image is built from is therefore a tree no pull request ever built, and a
  # regenerated lockfile is exactly what changes which modules land in the
  # runner stage. Nothing else stands between that tree and GHCR.
  docker-image:
    name: Build Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: semantic-release
    if: needs.semantic-release.outputs.released == 'true'
    permissions:
      contents: read
      packages: write
    env:
      # Points at the service container below, published on the runner.
      DATABASE_URL: postgres://coderso:postgres@127.0.0.1:5432/coderso_image_gate
      APP_PORT: "3210"
      BOOT_TIMEOUT_SECONDS: "240"
      BOOT_LOG_FILE: .tmp/image-boot-gate.log
    services:
      # Throwaway, empty, and on the direct port 5432 — the session-lock guard
      # in core/db/connectionTargets.ts refuses a pooled port (6432).
      # Keep the major version aligned with the deployment target.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: coderso
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coderso_image_gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username coderso --dbname coderso_image_gate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
    steps:
      - name: Create semantic-release GitHub App token
        id: semantic-release-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SEMANTIC_RELEASE_APP_ID }}
          private-key: ${{ secrets.SEMANTIC_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.semantic-release.outputs.git_tag }}
          token: ${{ steps.semantic-release-app-token.outputs.token }}

      - name: Set image tags
        id: image
        run: |
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          image_name="$(printf '%s' "${DOCKER_IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/${image_name}"
          echo "name=${image}" >> "$GITHUB_OUTPUT"
          echo "local_tag=coderso-core:release-boot-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "candidate_tag=${image}:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "version_tag=${image}:${{ needs.semantic-release.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${image}:latest" >> "$GITHUB_OUTPUT"

      - name: Resolve release revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # BUILD 1 OF 2 — verification only; this export never leaves the runner.
      #
      # The boot gate has to RUN the image, so this build goes through `load`
      # into the local daemon, and the docker exporter behind `load` cannot
      # write a provenance attestation — hence `provenance: false` HERE, and
      # only here. The staged artifact is built by the second build below, with
      # its attestation intact, and its immutable digest is checked against the
      # image that booted before either stable release tag can be promoted.
      - name: Build coderso-core image for boot verification
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          provenance: false
          tags: ${{ steps.image.outputs.local_tag }}
          build-args: |
            APP_VERSION=${{ needs.semantic-release.outputs.version }}
          labels: |
            org.opencontainers.image.title=coderso-core
            org.opencontainers.image.version=${{ needs.semantic-release.outputs.version }}
            org.opencontainers.image.revision=${{ steps.revision.outputs.sha }}

      # A failure here leaves the release tagged with no image published, which
      # is strictly better than the previous behaviour: a crash-looping image
      # under :latest that nothing had ever started. Re-running this job alone
      # republishes once the cause is fixed.
      - name: Verify the release image boots and serves
        shell: bash
        env:
          IMAGE_REF: ${{ steps.image.outputs.local_tag }}
        run: .github/scripts/verify-image-boot.sh

      - name: Upload release image boot log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-image-boot-gate-log
          path: .tmp/image-boot-gate.log
          if-no-files-found: ignore

      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Package publishing stays on the workflow token; branch bypass is
          # handled by the GitHub App token used for release git/API work.
          password: ${{ secrets.GITHUB_TOKEN }}

      # BUILD 2 OF 2 — a uniquely named release candidate.
      #
      # Same context, same Dockerfile, same build args and labels, same builder,
      # in the same job: every layer comes back out of build 1's cache, so this
      # is a re-export rather than a second compile. It differs from build 1 in
      # exactly one respect — it goes through the image exporter to the
      # registry, which CAN carry the SLSA provenance attestation that `load`
      # cannot. Only the run-scoped candidate tag is visible at this point.
      # Neither the version tag nor :latest is written until the candidate's
      # immutable digest has passed the identity check below.
      - name: Publish coderso-core release candidate with provenance
        id: candidate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          # `push: true` is only shorthand for another registry output. Use one
          # explicit exporter so the attestation shape checked below is not left
          # to the exporter's legacy defaults.
          outputs: type=registry,oci-mediatypes=true,oci-artifact=true
          # Pin min-mode SLSA v0.2 explicitly, with a builder id that names the
          # run that produced the image, so the verifier and exporter cannot
          # drift when a future BuildKit changes defaults.
          # `provenance: true` would attest without naming the run, which is
          # most of what the attestation is for.
          provenance: mode=min,version=v0.2,inline-only=true,builder-id=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          tags: ${{ steps.image.outputs.candidate_tag }}
          build-args: |
            APP_VERSION=${{ needs.semantic-release.outputs.version }}
          labels: |
            org.opencontainers.image.title=coderso-core
            org.opencontainers.image.version=${{ needs.semantic-release.outputs.version }}
            org.opencontainers.image.revision=${{ steps.revision.outputs.sha }}

      # Two exports mean two artifacts, and "same builder, warm cache" is an
      # argument rather than a check. Pinning this read to build-push-action's
      # digest removes mutable-tag races while the comparison covers the layer
      # diff IDs, startup configuration, the attestation's image-digest binding,
      # and the decoded SLSA predicate for this run. A failure here leaves the
      # prior stable tags untouched.
      - name: Verify the staged candidate is the image that booted
        shell: bash
        env:
          LOCAL_IMAGE_REF: ${{ steps.image.outputs.local_tag }}
          CANDIDATE_REF: ${{ steps.image.outputs.candidate_tag }}@${{ steps.candidate.outputs.digest }}
          EXPECTED_PROVENANCE_BUILDER_ID: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/verify-published-image.sh

      # Promotion copies the already-verified image index by immutable digest;
      # it does not rebuild or resolve the mutable candidate tag. The script
      # uses authenticated registry HEAD requests to keep the version tag
      # immutable and fresh origin tag enumeration to prevent a stale rerun
      # from rolling :latest backward.
      - name: Promote the verified candidate to final release tags
        shell: bash
        env:
          CANDIDATE_REF: ${{ steps.image.outputs.candidate_tag }}@${{ steps.candidate.outputs.digest }}
          VERSION_REF: ${{ steps.image.outputs.version_tag }}
          LATEST_REF: ${{ steps.image.outputs.latest_tag }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/promote-release-image.sh
