name: Semantic Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  BUN_VERSION: 1.3.13
  NODE_VERSION: 22.14.0
  DOCKER_IMAGE_NAME: coderso-core

jobs:
  semantic-release:
    name: Semantic release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      pull-requests: read
    outputs:
      released: ${{ steps.release-metadata.outputs.released }}
      version: ${{ steps.release-metadata.outputs.version }}
      git_tag: ${{ steps.release-metadata.outputs.git_tag }}
    steps:
      - name: Create semantic-release GitHub App token
        id: semantic-release-app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.SEMANTIC_RELEASE_APP_ID }}
          private-key: ${{ secrets.SEMANTIC_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          token: ${{ steps.semantic-release-app-token.outputs.token }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify release runtime
        run: |
          node --version
          bun --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run semantic-release
        env:
          GH_TOKEN: ${{ steps.semantic-release-app-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.semantic-release-app-token.outputs.token }}
        run: bun run release:semantic

      - name: Export release metadata
        id: release-metadata
        run: |
          if [ -f .tmp/semantic-release.env ]; then
            cat .tmp/semantic-release.env >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "git_tag=" >> "$GITHUB_OUTPUT"
          fi

  docker-image:
    name: Build Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: semantic-release
    if: needs.semantic-release.outputs.released == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Create semantic-release GitHub App token
        id: semantic-release-app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.SEMANTIC_RELEASE_APP_ID }}
          private-key: ${{ secrets.SEMANTIC_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Checkout release tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.semantic-release.outputs.git_tag }}
          token: ${{ steps.semantic-release-app-token.outputs.token }}

      - name: Set image tags
        id: image
        run: |
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          image_name="$(printf '%s' "${DOCKER_IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/${image_name}"
          echo "name=${image}" >> "$GITHUB_OUTPUT"
          echo "version_tag=${image}:${{ needs.semantic-release.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${image}:latest" >> "$GITHUB_OUTPUT"

      - name: Resolve release revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Package publishing stays on the workflow token; branch bypass is
          # handled by the GitHub App token used for release git/API work.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push coderso-core image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.version_tag }}
            ${{ steps.image.outputs.latest_tag }}
          build-args: |
            APP_VERSION=${{ needs.semantic-release.outputs.version }}
          labels: |
            org.opencontainers.image.title=coderso-core
            org.opencontainers.image.version=${{ needs.semantic-release.outputs.version }}
            org.opencontainers.image.revision=${{ steps.revision.outputs.sha }}
