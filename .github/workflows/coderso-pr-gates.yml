name: Coderso PR Gates

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14
  NODE_VERSION: 26.5.0

jobs:
  database-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || vars.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify CI runtime
        run: |
          node --version
          bun --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify CI database env
        shell: bash
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DATABASE_URL repository secret or variable is required for Coderso PR gates."
            exit 1
          fi

      - name: Check and apply database migrations
        run: bun run db:migrate

  vitest-lane:
    needs: database-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || vars.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify CI runtime
        run: |
          node --version
          bun --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint core
        run: bun --cwd core lint

      - name: Typecheck core
        run: bun --cwd core lint:types

      - name: Lint store
        run: bun --cwd store lint

      - name: Typecheck SDK
        run: ./node_modules/.bin/tsc -p packages/sdk/tsconfig.json --noEmit

      - name: Run Vitest lane
        run: bun run test:vitest

      - name: Run Vitest coverage
        run: bun run test:coverage

      - name: Upload Vitest coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-coverage
          path: coverage/vitest

  bun-lane:
    needs: database-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || vars.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify CI runtime
        run: |
          node --version
          bun --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Bun lane
        run: bun run test:bun:lane

      - name: Run Bun coverage
        run: bun run test:coverage:bun

      - name: Upload Bun coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bun-coverage
          path: coverage/bun

  admin-bundle-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify CI runtime
        run: |
          node --version
          bun --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build admin bundle
        run: bun --cwd core build:admin

      - name: Check admin bundle budget
        run: bun run check:admin-bundle

      - name: Upload admin bundle report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: admin-bundle-report
          path: .tmp/admin-bundle-report.json

  # Builds the production image from the repository Dockerfile, starts a
  # container from it and refuses to pass until that container serves HTTP.
  #
  # The image runs the app from TypeScript source, so imports resolve at BOOT,
  # not at build time: a module missing from the runner stage builds cleanly and
  # only fails when the container starts. Nothing above this job can see that —
  # they all run against the repository's own node_modules, never the image.
  #
  # No secret is used. The database is a throwaway service container, so this
  # job runs identically on a pull request from a fork, and the boot is
  # hermetic: no shared database, no cross-run interference.
  image-boot-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      IMAGE_REF: coderso-core:ci-${{ github.run_id }}
      # Points at the service container below, published on the runner.
      DATABASE_URL: postgres://coderso:postgres@127.0.0.1:5432/coderso_image_gate
      APP_PORT: "3210"
      BOOT_TIMEOUT_SECONDS: "240"
      BOOT_LOG_FILE: .tmp/image-boot-gate.log
    services:
      # Empty database on the standard direct port. Port 5432 matters: the
      # session-lock guard in core/db/connectionTargets.ts refuses a pooled port
      # (6432), and startup migrations take a session advisory lock.
      # Keep the major version aligned with the deployment target.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: coderso
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coderso_image_gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username coderso --dbname coderso_image_gate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Scope, rather than a workflow-level paths filter: the job always reports
      # a status, so it can be a required check without hanging pending on the
      # pull requests it skips.
      - name: Decide whether this change can reach the image
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Event ${GITHUB_EVENT_NAME}: verifying the image unconditionally."
            exit 0
          fi
          if [ -z "${BASE_SHA:-}" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Base commit unavailable; verifying the image rather than assuming it is unaffected."
            exit 0
          fi
          if ! changed="$(git diff --name-only "${BASE_SHA}" HEAD)"; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Could not diff against the base commit; verifying the image."
            exit 0
          fi
          printf '%s\n' "${changed}" | sed 's/^/  changed: /'
          # Exactly what the Dockerfile copies into the build context — core,
          # docs, packages, themes, the four package.json files it installs
          # from, the lockfile and bunfig.toml — plus the files that define this
          # gate. store/ is excluded beyond its package.json because the image
          # never receives it, and _docs/, tests/ and scripts/ cannot reach the
          # image at all.
          if printf '%s\n' "${changed}" | grep -qE '^(Dockerfile$|\.dockerignore$|bun\.lock$|bunfig\.toml$|package\.json$|store/package\.json$|core/|docs/|packages/|themes/|\.github/workflows/coderso-pr-gates\.yml$|\.github/scripts/verify-image-boot\.sh$)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Image-shaping paths changed: building and booting the image."
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "No image-shaping path changed: nothing in this pull request reaches the runtime image."
          fi

      - name: Setup Docker Buildx
        if: steps.scope.outputs.build == 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build coderso-core image
        if: steps.scope.outputs.build == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          # Local only: a pull request never publishes an image anywhere.
          push: false
          load: true
          # A provenance attestation turns the result into a manifest list,
          # which the docker exporter behind `load` cannot write.
          provenance: false
          tags: ${{ env.IMAGE_REF }}
          build-args: |
            APP_VERSION=0.0.0
          cache-from: type=gha,scope=coderso-core-image
          cache-to: type=gha,mode=max,scope=coderso-core-image,ignore-error=true

      # Fails the pull request when the container does not serve. The script
      # dumps the container's log and names the cause; a missing module gets its
      # own annotation instead of an unexplained timeout.
      - name: Verify the image boots and serves
        if: steps.scope.outputs.build == 'true'
        shell: bash
        run: .github/scripts/verify-image-boot.sh

      - name: Upload image boot log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-boot-gate-log
          path: .tmp/image-boot-gate.log
          if-no-files-found: ignore

  security-gate:
    needs:
      - vitest-lane
      - bun-lane
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install Semgrep
        run: pip install semgrep==1.170.1

      - name: Run Semgrep (SAST)
        run: |
          semgrep \
            --error \
            --config .semgrep.yml \
            --config p/owasp-top-ten \
            --config p/security-audit \
            --config p/nodejs \
            --config p/typescript \
            --sarif \
            --output semgrep.sarif

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: semgrep.sarif

      - name: Generate Trivy SARIF (SCA/CVE)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy.sarif
          exit-code: "0"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          scanners: "vuln,secret,misconfig"
          limit-severities-for-sarif: true
          skip-dirs: "_docs,node_modules,dist,build,.next,.git"

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: trivy.sarif

      - name: Run Gitleaks (Secrets)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"

      - name: Run Trivy (Blocking Gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          scanners: "vuln,secret,misconfig"
          skip-dirs: "_docs,node_modules,dist,build,.next,.git"
          skip-setup-trivy: true

      - name: Upload security gate artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-gate-reports
          path: |
            semgrep.sarif
            trivy.sarif

  coderso-release-gates:
    needs: security-gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "true"
      FORM_SUBMIT_NONCE_SECRET: "nextless_release_gate_nonce_secret_32"
      CODERSO_PERF_LISTING_P95_CACHED_MS: "300"
      CODERSO_PERF_LISTING_P95_COLD_MS: "900"
      CODERSO_PERF_ADMIN_NAV_P95_MS: "150"
      DATABASE_URL: ${{ secrets.DATABASE_URL || vars.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify CI runtime
        run: |
          node --version
          bun --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Coderso release gates
        run: bun scripts/coderso-release-gates.ts --report .tmp/coderso-release-gates.json

      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coderso-release-gates-report
          path: .tmp/coderso-release-gates.json
